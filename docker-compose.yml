version: "3.8"

# Run this on your own machine (needs Docker Desktop) to bring up a REAL
# Kafka broker + S3-compatible object store, mirroring what would be
# Kafka + an OpenShift-hosted object store (e.g. ODF/Ceph or MinIO) in prod.
#
#   docker compose up -d
#   docker exec -it kafka kafka-topics --create --topic orders.raw \
#       --bootstrap-server localhost:9092 --partitions 3 --replication-factor 1
#
# Then point kafka/producer.py and kafka/consumer.py at localhost:9092.

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=lakehouse
      - MINIO_ROOT_PASSWORD=lakehouse123
    volumes:
      - minio-data:/data

volumes:
  minio-data:
